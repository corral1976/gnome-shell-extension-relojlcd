name: CI & Build Release for GNOME Extension

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
build:
    name: Validate and Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gettext

      - name: Validate metadata.json
        run: |
          if [ -f "metadata.json" ]; then
            jq . metadata.json > /dev/null
            echo "metadata.json es un JSON válido."
          else
            echo "Error: metadata.json no se encuentra en la raíz del repositorio."
            exit 1
          fi

      - name: Get Extension UUID
        id: get_uuid
        run: |
          UUID=$(jq -r '.uuid' metadata.json)
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      # NUEVO: compila schemas y traducciones
      - name: Compile schemas and translations
        run: |
          glib-compile-schemas schemas
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "locale/$lang/LC_MESSAGES"
            msgfmt "$po" -o "locale/$lang/LC_MESSAGES/relojlcd.mo"
          done

      # CAMBIADO: ahora excluye po/ y preview.png, e incluye LICENSE
      - name: Create Extension Package (.zip)
        run: |
          zip -r "${{ steps.get_uuid.outputs.uuid }}.zip" . \
            -x "*.git*" ".github/*" "README.md" "po/*" "preview.png"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: extension-package
          path: "${{ steps.get_uuid.outputs.uuid }}.zip"
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
