stages:
  - build
  - test
  - release

variables:
  PACKAGE_NAME: "gnome-shell-extension-relojlcd"
  DEBIAN_FRONTEND: noninteractive

build:extension:
  stage: build
  image: registry.fedoraproject.org/fedora:latest
  before_script:
    - dnf install -y glib2-devel
  script:
    - glib-compile-schemas schemas
    - echo "Extension build completed"
  artifacts:
    paths:
      - schemas/gschemas.compiled
    expire_in: 30 days
  only:
    - main
    - tags

lint:json:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache jq
  script:
    - jq empty metadata.json
    - echo "JSON validation passed"
  only:
    - main
    - merge_requests

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG
  only:
    - tags
  when: manual
